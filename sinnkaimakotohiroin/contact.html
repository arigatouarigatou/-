<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新海誠ヒロインズ - トップページ</title>
    <link rel="stylesheet" href="style2.css">
</head>

<body>

    <header>
        <nav>
            <ul>
                <li><a href="index.html">トップページ</a></li>
                <li><a href="sakuhin.html">作品紹介ページ</a></li>
                <li><a href="heroines.html">ヒロイン紹介ページ</a></li>
                <li><a href="contact.html">お問い合わせページ</a></li>
            </ul>
        </nav>
    </header>

    <main>

          <div class="form-container">
        <h2>お問い合わせ</h2>
        
        <!-- フォーム送信先は仮で # にしています -->
        <form action="#" method="post">
            
            <!-- ユーザーネーム -->
            <div class="form-group">
                <label for="username" class="field-label">ユーザーネーム</label>
                <input type="text" id="username" name="username" placeholder="お名前を入力してください" required>
            </div>

            <!-- 作品名（ラジオボタン） -->
            <div class="form-group">
                <label class="field-label">作品名を選択</label>
                <div class="radio-group">
                    <label class="radio-option">
                        <input type="radio" name="work_title" value="kiminona" checked>
                        君の名は
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="work_title" value="tenkinoko">
                        天気の子
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="work_title" value="suzume">
                        すずめの戸締まり
                    </label>
                </div>
            </div>

            <!-- コメント -->
            <div class="form-group">
                <label for="comment" class="field-label">コメント</label>
                <textarea id="comment" name="comment" placeholder="感想やお問い合わせ内容を入力してください"></textarea>
            </div>

            <!-- 送信ボタン -->
            <button type="submit" class="submit-btn">送信する</button>

        </form>
    </div>

    </main>

</body>

</html>

    <style>
    

        /* フォームのコンテナ（白い箱部分） */
        .form-container {
            background-color: #fff;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #444;
            font-size: 24px;
        }

        /* 各入力エリアのグループ */
        .form-group {
            margin-bottom: 20px;
        }

        /* ラベルのデザイン */
        label.field-label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 14px;
        }

        /* テキスト入力とテキストエリアのデザイン */
        input[type="text"],
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
            box-sizing: border-box; /* パディングを含めた幅にする */
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        textarea:focus {
            border-color: #66afe9;
            outline: none;
        }

        textarea {
            resize: vertical; /* 縦方向のみサイズ変更可能 */
            min-height: 120px;
        }

        /* ラジオボタンのグループデザイン */
        .radio-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            background-color: #fafafa;
            padding: 15px;
            border-radius: 4px;
            border: 1px solid #eee;
        }

        .radio-option {
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .radio-option input[type="radio"] {
            margin-right: 10px;
            transform: scale(1.2); /* ラジオボタンを少し大きく */
            cursor: pointer;
        }

        /* 送信ボタンのデザイン */
        .submit-btn {
            width: 100%;
            padding: 14px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background-color: #0056b3;
        }

        /* スマートフォン向け調整 */
        @media (max-width: 480px) {
            .form-container {
                padding: 20px;
            }
        }
    </style>
